# Churn production platform -- full-stack Docker Compose.
#
# Full-stack platform. `profiles` gate each subsystem so a bare `docker compose up` stays minimal
# and everything is opt-in (see ENHANCEMENT_PLAN.md, architecture section). Profiles: streaming
# (Redpanda + producer + Quix consumer + Redis), serve (FastAPI batch /score + alias-following
# /score/online), tracking (MLflow), orchestration (Dagster UI + weekly retrain schedule),
# observability (Prometheus + Grafana), dashboard (Streamlit), test (real-infra integration
# runner). Pairings: serve+tracking+streaming = the full online demo; serve+observability = live
# Grafana panels.
name: churn-platform

services:
  # --- Event transport (Phase 2-3): Redpanda, Kafka-API compatible ---
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
    restart: unless-stopped
    mem_limit: 1g
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10
    profiles: ["streaming", "test"]

  # --- Online feature store (Phase 2): Redis ---
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    mem_limit: 256m
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    profiles: ["featurestore", "serve", "test"]

  # --- Topic bootstrap (Phase 2): create the events topic once, idempotently ---
  topic-init:
    image: redpandadata/redpanda:v24.2.7
    entrypoint: ["/bin/bash", "-c"]
    command: ["rpk topic create customer-events -p 1 -r 1 --brokers redpanda:9092 || true"]
    depends_on:
      redpanda:
        condition: service_healthy
    restart: "no"
    profiles: ["streaming"]

  # --- Event producer (Phase 2-3): replay the event log to a Redpanda topic ---
  producer:
    build:
      context: .
      dockerfile: infra/Dockerfile.streaming
    command: ["python", "-m", "churn.streaming.producer"]
    environment:
      REDPANDA_BROKER: "redpanda:9092"
      EVENTS_TOPIC: "customer-events"
      EVENTS_PARQUET: "data/stream/events.parquet"
    depends_on:
      redpanda:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
    profiles: ["streaming"]

  # --- Streaming feature consumer (Phase 2-3): Quix Streams -> Redis online store ---
  consumer:
    build:
      context: .
      dockerfile: infra/Dockerfile.streaming
    command: ["python", "-m", "services.consumer.app"]
    environment:
      REDPANDA_BROKER: "redpanda:9092"
      EVENTS_TOPIC: "customer-events"
      CONSUMER_GROUP: "churn-streaming-v1"
      REDIS_URL: "redis://redis:6379/0"
      CHURN_AS_OF: "2025-01-01T00:00:00"
      CHURN_STATE_DIR: "/var/lib/quix-state"
      CONSUMER_TIMEOUT: "0"
    restart: unless-stopped
    mem_limit: 512m
    # Persist Quix's per-customer state across restarts. Correctness is guaranteed by the changelog
    # (use_changelog_topics=True) even if this is lost; the volume just avoids a full changelog
    # replay on a routine restart. See services/consumer/app.py::run_consumer.
    volumes:
      - consumer-state:/var/lib/quix-state
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["streaming"]

  # --- On-demand BATCH scoring API (Phase 3): pinned baked-in model, self-contained image ---
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped
    mem_limit: 1g
    profiles: ["serve"]

  # --- ONLINE scoring API (ADR 0006): follows the MLflow @champion alias. Redis is a hard
  # dependency (the feature envelopes); MLflow is deliberately SOFT -- no depends_on, the app
  # starts degraded and recovers via the lazy-TTL re-resolve when the tracking profile is up.
  # Full online demo = `--profile serve --profile tracking --profile streaming`.
  api-online:
    build:
      context: .
      dockerfile: infra/Dockerfile.online
    ports:
      - "8001:8001"
    restart: unless-stopped
    mem_limit: 1g
    environment:
      REDIS_URL: "redis://redis:6379/0"
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
      MLFLOW_MODEL_NAME: "churn-online"
      CHURN_AS_OF: "2025-01-01T00:00:00"
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["serve"]

  # --- Ops observability (Phase 6): Prometheus + Grafana, ops-only ---
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped
    mem_limit: 512m
    profiles: ["observability"]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      # No committed literal (REV-16): set GRAFANA_ADMIN_PASSWORD in an untracked .env
      # (see .env.example) before bringing the observability profile up.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env (see .env.example)}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      - prometheus
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    profiles: ["observability"]

  # --- ML mission-control (Phase 6): Streamlit ---
  dashboard:
    build:
      context: .
      dockerfile: infra/Dockerfile.dashboard
    ports:
      - "8501:8501"
    restart: unless-stopped
    # The mission-control render path runs the full backtest (REV-20); needs headroom.
    mem_limit: 2g
    profiles: ["dashboard"]

  # --- Orchestration (Phase 5): the real Dagster code location (assets + jobs + the weekly
  # drift-gated retrain schedule). UI on host port 3001 (Grafana owns 3000). ---
  dagster:
    build:
      context: .
      dockerfile: infra/Dockerfile.dagster
    ports:
      - "3001:3000"
    restart: unless-stopped
    mem_limit: 1g
    volumes:
      - dagster-home:/opt/dagster
    profiles: ["orchestration"]

  # --- MLflow tracking + model registry (Phase 4): champion/challenger aliases ---
  mlflow:
    build:
      context: .
      dockerfile: infra/Dockerfile.mlflow
    ports:
      - "5000:5000"
    restart: unless-stopped
    # MLflow 3.x runs multiple uvicorn workers; 512m OOM-kills them in a loop.
    mem_limit: 1g
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
    profiles: ["tracking", "test"]

  # --- Real-infra integration tests (Phase 2+): pytest -m integration against LIVE Redpanda +
  # Redis + MLflow (no mocked infra). The whole repo is bind-mounted read-only so tests pick up
  # live source without a rebuild; deps live in /opt/venv inside the image. Run one-shot with:
  #   docker compose --profile test run --rm test-runner
  test-runner:
    build:
      context: .
      dockerfile: infra/Dockerfile.test
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    environment:
      REDPANDA_BROKER: "redpanda:9092"
      REDIS_URL: "redis://redis:6379/0"
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
    volumes:
      - .:/app:ro
    working_dir: /app
    profiles: ["test"]

volumes:
  redpanda-data:
  redis-data:
  grafana-data:
  mlflow-data:
  consumer-state:
  dagster-home:
