# Churn production platform -- full-stack Docker Compose.
#
# PHASE 0 SKELETON: service placeholders so `docker compose config` validates.
# Nothing here is wired up yet. Each service is fleshed out in its phase
# (ENHANCEMENT_PLAN.md §5 architecture / §8 phases). `profiles` gate services
# whose code/images do not exist until later phases, so a bare `docker compose up`
# stays minimal and the not-yet-real services are opt-in.
name: churn-platform

services:
  # --- Event transport (Phase 2-3): Redpanda, Kafka-API compatible ---
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10
    profiles: ["streaming"]

  # --- Online feature store (Phase 2): Redis ---
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    profiles: ["featurestore", "serve"]

  # --- On-demand scoring API (Phase 3): FastAPI /score, existing Dockerfile ---
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["serve"]

  # --- Ops observability (Phase 6): Prometheus + Grafana, ops-only ---
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    profiles: ["observability"]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    volumes:
      - grafana-data:/var/lib/grafana
    profiles: ["observability"]

  # --- ML mission-control (Phase 6): Streamlit. Placeholder image until built. ---
  dashboard:
    image: python:3.11-slim
    command: ["python", "-c", "print('streamlit ML mission-control -- Phase 6 placeholder')"]
    profiles: ["dashboard"]

  # --- Orchestration (Phase 5): Dagster. Placeholder image until built. ---
  dagster:
    image: python:3.11-slim
    command: ["python", "-c", "print('dagster orchestration -- Phase 5 placeholder')"]
    profiles: ["orchestration"]

volumes:
  redpanda-data:
  redis-data:
  grafana-data:
