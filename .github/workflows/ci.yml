name: ci

on:
  push:
    branches: [main, enhancement]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Run the manual deploy placeholder"
        required: false
        default: "false"

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.4"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --all-extras --all-groups
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tests
        run: uv run pytest --cov=churn --cov-report=term-missing
      - name: Pipeline smoke
        run: uv run python -m churn.train --smoke

  # Layer 1 -- lock consistency (PHASE0_LOCK_DECISIONS.md D2). Recompute every FROZEN-file hash +
  # the beacon recipe and assert equality with simulator.lock.json; non-zero exit on drift.
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.4"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (base only)
        run: uv sync
      - name: Layer 1 -- simulator lock consistency
        run: uv run python -m churn.simulator.lock

  # Layer 2 -- same-commit separation (D2). On PRs, fail if one change set touches BOTH the FROZEN
  # set and the RESULTS set. fetch-depth: 0 is required for the base..HEAD diff. Direct pushes to
  # main are NOT covered here by design -- branch protection must forbid them (see docs/adr/0001).
  lock-separation:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Layer 2 -- forbid co-modifying FROZEN + RESULTS
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          merge_base=$(git merge-base "$BASE_SHA" HEAD)
          changed=$(git diff --name-only "$merge_base" HEAD)
          echo "Changed files (since merge-base $merge_base):"; echo "$changed"
          # FROZEN set: the Stage-1 world + the ENFORCEMENT code itself (kernels/params/beacon/lock
          # + this workflow), so a results PR cannot weaken the checker/guard while staying clean.
          # Stage 2 adds analysis_spec.json + the ANALYSIS code (generator + feature/model/eval/
          # measure modules) -- the code that deterministically produces the confirmatory result.
          frozen=$(echo "$changed" | grep -E '^(docs/simulator_spec\.md|simulator\.params\.json|simulator\.lock\.json|analysis_spec\.json|src/churn/simulator/(kernels|params|beacon|lock|rng|latent|population|events|generate)\.py|src/churn/featurestore/offline\.py|src/churn/instrument/(model|experiment|floors|measure)\.py|\.github/workflows/ci\.yml)$' || true)
          # RESULTS set: the confirmatory / instrument-validation artifacts (appear at Stage 2).
          results=$(echo "$changed" | grep -E '^reports/instrument_validation/' || true)
          if [ -n "$frozen" ] && [ -n "$results" ]; then
            echo "::error::Layer-2 violation: one change set touches BOTH the FROZEN and RESULTS sets."
            echo "FROZEN touched:";  echo "$frozen"
            echo "RESULTS touched:"; echo "$results"
            echo "A re-lock must be a conspicuous, reviewed, results-free commit (D2/D3)."
            exit 1
          fi
          echo "Layer-2 OK: FROZEN and RESULTS were not co-modified."

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker build -t churn-scoring:ci .
      - name: Smoke test the API (model baked in at build time)
        run: |
          docker run -d --rm -p 8000:8000 --name churn-api churn-scoring:ci
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health | grep -q '"model_loaded":true'; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then echo "health never reported a loaded model"; docker logs churn-api; docker stop churn-api; exit 1; fi
          curl -fsS -X POST http://localhost:8000/score \
            -H 'Content-Type: application/json' \
            -d '{"customer_id":"ci-1","region":"North","device_type":"Mobile","subscription_plan":"Free","account_age_days":30,"monthly_spend":12.5,"num_orders_last_90d":0,"avg_order_value":25.0,"support_tickets_raised":1,"days_since_last_login":40,"pages_per_session":2.0}' \
            | tee /tmp/score.json
          grep -q '"churn_probability"' /tmp/score.json || { echo "/score did not return a probability"; docker stop churn-api; exit 1; }
          docker stop churn-api
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/churn-scoring:${{ github.sha }}
          docker tag churn-scoring:ci "$IMAGE"
          docker push "$IMAGE"

  deploy-placeholder:
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == 'true'
    steps:
      - name: Manual deploy gate
        run: |
          echo "Deploy hook placeholder: wire this to the target runtime when one exists."
