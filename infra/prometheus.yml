# Prometheus scrape config (ops-only: FastAPI latency/throughput/errors).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The FastAPI scoring service exposes churn_http_* metrics at /metrics (Phase 6).
  - job_name: churn-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
