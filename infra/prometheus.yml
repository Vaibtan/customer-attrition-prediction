# Prometheus scrape config (ops-only: FastAPI latency/throughput/errors).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The FastAPI scoring services expose churn_http_* metrics at /metrics (Phase 6). NOTE: these
  # services live in the `serve` profile -- run `--profile serve --profile observability` for
  # live panels (a lone observability profile scrapes nothing).
  - job_name: churn-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: churn-api-online
    metrics_path: /metrics
    static_configs:
      - targets: ["api-online:8001"]
