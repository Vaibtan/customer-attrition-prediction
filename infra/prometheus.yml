# Prometheus scrape config (ops-only: FastAPI latency/throughput/errors).
# Phase 6 wires real targets; this Phase-0 skeleton scrapes only Prometheus itself
# so the config is valid and the bind mount in compose.yaml resolves.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Phase 3+: the FastAPI /score service exposes /metrics.
