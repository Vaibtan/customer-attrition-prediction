[project]
name = "customer-attrition-prediction"
version = "0.1.0"
description = "Leak-free, reproducible customer churn prediction pipeline."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "joblib>=1.3",
]

[project.optional-dependencies]
serve = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "prometheus-client>=0.21",   # ops metrics: /metrics endpoint (Phase 6)
]
# Platform extras (gated per phase; base install stays lean). Each earns its place
# in a later phase (ENHANCEMENT_PLAN.md §2); nothing here is imported at Phase 0.
# The streaming stack runs in Linux containers (Redpanda producer/consumer via
# Docker Compose), so these are scoped to Linux -- quix-streams has no win32
# wheels for newer Python, and the dev box never runs them bare-metal.
streaming = [
    "confluent-kafka>=2.5 ; sys_platform == 'linux'",   # Redpanda producer (Phase 2-3)
    "quixstreams>=3.0 ; sys_platform == 'linux'",        # event-time windowed aggregation (Phase 2-3)
]
featurestore = [
    "redis>=5.0",             # online store (Phase 2)
    "duckdb>=1.1",            # offline store + ASOF PIT joins (Phase 1)
    "pyarrow>=17.0",          # Parquet engine for the durable event log (Phase 1, D6.3)
]
orchestration = [
    "dagster>=1.9",           # asset-based DAGs, partitioned backfills (Phase 5)
    "dagster-webserver>=1.9", # Dagster UI
]
tracking = [
    "mlflow>=2.17",           # tracking + registry, gated to Phase 4
]
dashboard = [
    "streamlit>=1.40",        # ML mission-control (Phase 6)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churn"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: real-infra tests exercised against live Docker services (Redpanda, Redis, ...).",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["churn"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
